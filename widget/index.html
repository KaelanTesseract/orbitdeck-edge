<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tr('Orbitdeck Edge')</title>
  <link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
  <link rel="stylesheet" href="styles/orbitdeck.css" />
  <link rel="stylesheet" href="styles/features.css" />
  <link rel="stylesheet" href="styles/hub.css" />

  <meta name="x-icue-property" content="scene" data-label="tr('Scene')" data-type="combobox" data-default="'ringworld'"
        data-values="[{'key':'ringworld','value':tr('Ring World')},{'key':'gasgiant','value':tr('Gas Giant')},{'key':'icemoon','value':tr('Ice Moon')},{'key':'redworld','value':tr('Red World')},{'key':'nebula','value':tr('Nebula')}]" />
  <meta name="x-icue-property" content="spin" data-label="tr('Planet Rotation')" data-type="combobox" data-default="'300'"
        data-values="[{'key':'90','value':tr('1.5 min per turn')},{'key':'180','value':tr('3 min per turn')},{'key':'300','value':tr('5 min per turn')},{'key':'600','value':tr('10 min per turn')},{'key':'0','value':tr('Hold still')}]" />
  <meta name="x-icue-property" content="rocks" data-label="tr('Rocks in Orbit')" data-type="tab-buttons" data-default="'full'"
        data-values="[{'key':'full','value':tr('Full')},{'key':'less','value':tr('Lower')},{'key':'minimal','value':tr('Lowest')}]" />
  <meta name="x-icue-property" content="motion" data-label="tr('Animation')" data-type="tab-buttons" data-default="'smooth'"
        data-values="[{'key':'smooth','value':tr('Smooth')},{'key':'saver','value':tr('Power Saver')}]" />
  <meta name="x-icue-property" content="quality" data-label="tr('Render Quality')" data-type="tab-buttons" data-default="'high'"
        data-values="[{'key':'high','value':tr('High')},{'key':'medium','value':tr('Medium')},{'key':'low','value':tr('Low')}]" />
  <meta name="x-icue-property" content="glow" data-label="tr('Light Glow')" data-type="switch" data-default="true" />
  <meta name="x-icue-property" content="tintScene" data-label="tr('Tint Scene With Accent Color')" data-type="switch" data-default="false" />

  <meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#f6f1e8'" />
  <meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#f0a24a'" />
  <meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#0a0b10'" />
  <meta name="x-icue-property" content="transparency" data-label="tr('Background Transparency')" data-type="slider"
        data-default="0" data-min="0" data-max="100" data-step="1" data-unit-label="'%'" />

  <script id="x-icue-groups" type="application/json">
  [
    { "title": "tr('Scene')", "properties": ["scene", "spin", "rocks", "motion", "quality", "glow", "tintScene"], "info": "tr('Lower the rocks or the render quality on less powerful PCs.')" },
    { "title": "tr('Widget Personalization')", "properties": ["textColor", "accentColor", "backgroundColor", "transparency"], "info": "tr('Background color tints the glass panels. Transparency lets the page background show through the scene.')" }
  ]
  </script>
</head>
<body>
  <div id="root" class="root loading">
    <canvas id="scene" class="scene"></canvas>
    <div class="fallback" id="fallback" hidden></div>

    <div class="ui" id="ui">
      <div class="card focus-card" id="focusCard" hidden>
        <div class="fc-top">
          <div class="fc-text"><div class="fc-state"><span class="dot"></span><span id="focusState"></span></div><div class="fc-task" id="focusTask"></div></div>
          <div class="fc-time"><div class="fc-elapsed" id="focusElapsed"></div><div class="fc-goal" id="focusGoal"></div></div>
        </div>
        <div class="fc-bar"><span id="focusBar"></span></div>
        <div class="card-actions">
          <button class="btn" data-act="focusPause" id="focusPause"></button>
          <button class="btn" data-act="focusDone" data-t="finish"></button>
          <button class="btn danger" data-act="focusStop" data-t="endSession"></button>
        </div>
      </div>

      <div class="card timer-card" id="timerCard" hidden>
        <div class="fc-top">
          <div class="fc-text"><div class="fc-state"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5" /><path d="M12 9v4l2.5 2M9.5 3h5" /></svg><span data-t="timerLabel"></span></div><div class="fc-task" id="timerName"></div></div>
          <div class="fc-time"><div class="fc-elapsed" id="timerLeft"></div></div>
        </div>
        <div class="fc-bar"><span id="timerBar"></span></div>
        <div class="card-actions">
          <button class="btn" data-act="timerPlus">+5 min</button>
          <button class="btn danger" data-act="timerStop" data-t="stopTimer"></button>
        </div>
      </div>

      <div class="notice" id="notice" hidden>
        <div class="notice-text" id="noticeText"></div>
        <div class="notice-actions"><button class="btn primary" id="noticeA"></button><button class="btn" id="noticeB"></button></div>
      </div>

      <main class="center" id="center">
        <div class="weekday" id="weekday"></div>
        <div class="date" id="date"></div>
        <div class="time"><span id="time"></span><span class="ampm" id="ampm"></span></div>
        <div class="rule"></div>
        <section class="music" id="music" hidden>
          <div class="viz" id="viz"></div>
          <div class="track" id="trackTitle"></div>
          <div class="artist" id="trackArtist"></div>
          <div class="controls">
            <button class="round small" data-media="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M7 6v12M18 6l-8 6 8 6z" /></svg></button>
            <button class="round play" id="playBtn" data-media="playPause" aria-label="Play/Pause"></button>
            <button class="round small" data-media="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M17 6v12M6 6l8 6-8 6z" /></svg></button>
          </div>
        </section>
      </main>

      <div class="panel-layer" id="panelLayer">
        <section class="panel" id="panel-music" data-panel="music">
          <div class="panel-head"><h2 data-t="music"></h2><button class="close" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button></div>
          <div class="panel-body music-body" id="musicBody">
            <div class="cover" id="mCover"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="17" cy="16" r="3" /></svg></div>
            <div class="m-info">
              <div class="m-title" id="mTitle"></div>
              <div class="m-artist" id="mArtist"></div>
              <div class="m-album" id="mAlbum"></div>
              <div class="controls big">
                <button class="round small" data-media="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M7 6v12M18 6l-8 6 8 6z" /></svg></button>
                <button class="round play" id="mPlay" data-media="playPause" aria-label="Play/Pause"></button>
                <button class="round small" data-media="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M17 6v12M6 6l8 6-8 6z" /></svg></button>
              </div>
            </div>
            <div class="side sound-side" id="soundSide"></div>
          </div>
        </section>
        <section class="panel" id="panel-shortcuts" data-panel="shortcuts">
          <div class="panel-head"><h2 data-t="shortcuts"></h2>
            <div class="tabs"><button id="scEdit" data-t="edit"></button></div>
            <button class="close" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button></div>
          <div class="panel-body sc-body" id="shortcutsBody"></div>
        </section>
        <section class="panel" id="panel-tasks" data-panel="tasks">
          <div class="panel-head"><h2 data-t="tasks"></h2>
            <div class="tabs"><button data-tab="today" data-t="tabToday"></button><button data-tab="upcoming" data-t="tabUpcoming"></button><button data-tab="history" data-t="tabHistory"></button><button data-tab="timer" data-t="tabTimer"></button></div>
            <button class="close" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button></div>
          <div class="panel-body split" id="tasksBody"></div>
        </section>
        <section class="panel" id="panel-calendar" data-panel="calendar">
          <div class="panel-head"><h2 data-t="calendar"></h2><button class="close" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button></div>
          <div class="panel-body split cal-body" id="calBody"></div>
        </section>
        <section class="panel" id="panel-system" data-panel="system">
          <div class="panel-head"><h2 data-t="system"></h2><button class="close" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button></div>
          <div class="panel-body split sys-body" id="systemBody"></div>
        </section>
        <section class="panel" id="panel-options" data-panel="options">
          <div class="panel-head"><h2 data-t="options"></h2><button class="close" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button></div>
          <div class="panel-body options">
            <div class="opt-col">
              <h3 data-t="clock"></h3>
              <button class="row-switch" data-opt="clock24"><span data-t="clock24"></span><i class="switch"></i></button>
              <button class="row-switch" data-opt="showWeekday"><span data-t="showWeekday"></span><i class="switch"></i></button>
              <button class="row-switch" data-opt="showDate"><span data-t="showDate"></span><i class="switch"></i></button>
            </div>
            <div class="opt-col">
              <h3 data-t="focus"></h3>
              <div class="row-label" data-t="breakEvery"></div>
              <div class="segmented" data-opt-seg="breakEvery">
                <button data-value="25">25</button><button data-value="50">50</button><button data-value="90">90</button><button data-value="0" data-t="offShort"></button>
              </div>
              <div class="row-label" data-t="breakLen"></div>
              <div class="segmented" data-opt-seg="breakLen">
                <button data-value="5">5</button><button data-value="10">10</button><button data-value="15">15</button>
              </div>
              <div class="row-label" data-t="micReminder"></div>
              <div class="segmented" data-opt-seg="micReminder">
                <button data-value="0" data-t="offShort"></button><button data-value="15">15</button><button data-value="30">30</button><button data-value="60">60</button>
              </div>
            </div>
            <div class="opt-col">
              <h3 data-t="movieMode"></h3>
              <p class="hint" data-t="movieHint"></p>
              <div class="row-label" data-t="movieBrightness"></div>
              <div class="segmented" data-opt-seg="movieBrightness">
                <button data-value="0">0 %</button><button data-value="10">10 %</button><button data-value="20">20 %</button><button data-value="35">35 %</button>
              </div>
            </div>
            <div class="opt-col">
              <h3 data-t="hubTitle"></h3>
              <div class="hub-state"><i class="hub-dot"></i><span id="hubState"></span></div>
              <p class="hint" id="hubHint"></p>
              <div class="hub-actions"><button class="btn" id="hubAsk" data-t="askAgain" hidden></button><button class="btn" id="openIcue" data-t="openIcue" hidden></button></div>
              <h3 data-t="data"></h3>
              <button class="hold-btn" id="resetBtn"><span class="hold-fill"></span><span class="hold-text" data-t="resetAll"></span></button>
              <p class="hint" data-t="resetHint"></p>
              <p class="about"><span id="version"></span><br /><span data-t="credits"></span></p>
            </div>
          </div>
        </section>
      </div>

      <nav class="dock" id="dock">
        <button class="dock-btn" data-open="music"><span class="ring"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="17" cy="16" r="3" /></svg></span><span class="lbl" data-t="music"></span></button>
        <button class="dock-btn" data-open="shortcuts"><span class="ring"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5" /><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5" /><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5" /><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" /></svg></span><span class="lbl" data-t="shortcuts"></span></button>
        <button class="dock-btn" data-open="tasks"><span class="ring"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M8 12.3l2.7 2.7L16 9.6" /></svg></span><span class="lbl" data-t="tasks"></span></button>
        <button class="dock-btn" data-open="calendar"><span class="ring"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2" /><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4M8 13.5h2M12 13.5h2M8 16.5h2" /></svg></span><span class="lbl" data-t="calendar"></span></button>
        <button class="dock-btn" data-open="system"><span class="ring"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="11.5" rx="1.5" /><path d="M9 20h6M12 16v4" /></svg></span><span class="lbl" data-t="system"></span></button>
        <button class="dock-btn" data-open="options"><span class="ring"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" /></svg></span><span class="lbl" data-t="options"></span></button>
      </nav>

      <button class="movie-btn" id="movieBtn" aria-label="Movie mode"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4" /></svg></button>
    </div>

    <div class="movie" id="movie"></div>
    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="scripts/i18n.js"></script>
  <script src="scripts/glyphs.js"></script>
  <script src="scripts/keyboard.js"></script>
  <script src="scripts/model.js"></script>
  <script src="scripts/sensors.js"></script>
  <script src="scripts/hub-client.js"></script>
  <script src="scripts/hub.js"></script>
  <script src="scripts/textures.js"></script>
  <script src="scripts/scene.js"></script>
  <script src="scripts/panels.js"></script>
  <script src="scripts/system.js"></script>
  <script src="scripts/music.js"></script>
  <script src="scripts/shortcuts.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
