name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test hub
        run: dotnet test hub.Tests --nologo

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate widget
        run: |
          npm install -g icuewidget-cli
          icuewidget validate widget

      - name: Test widget logic
        run: node --test tests/model.test.js tests/i18n-keys.test.js
